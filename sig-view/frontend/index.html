<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIG View — São Paulo</title>
  <link rel="icon" type="image/png" href="static/icon.png" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="static/css/style.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <h1>SIG View</h1>
      <div id="search-box">
        <input id="search-input" type="text" placeholder="Buscar endereço, CEP ou bairro..." autocomplete="off" />
        <ul id="search-results" hidden></ul>
      </div>
      <button id="settings-btn" type="button" title="Configurações">⚙ Configurações</button>
    </header>

    <div id="settings-overlay" hidden>
      <div id="settings-panel">
        <h2>Configurações</h2>
        <p class="hint">Aponte o programa para os recursos da rede local. Salvar recarrega a página.</p>

        <label for="cfg-layers-dir">Pasta de camadas (GeoJSON)</label>
        <input id="cfg-layers-dir" type="text" placeholder="\\servidor\sigview\layers" />

        <label for="cfg-geocoder-db">Banco de busca (geocoder.db)</label>
        <input id="cfg-geocoder-db" type="text" placeholder="\\servidor\sigview\geocoder.db" />

        <label for="cfg-mbtiles">Arquivo do mapa (.mbtiles)</label>
        <input id="cfg-mbtiles" type="text" placeholder="C:\SIGView\data\mapa.mbtiles" />

        <label for="cfg-tile-url">URL do servidor de mapas (tiles)</label>
        <input id="cfg-tile-url" type="text" placeholder="/tiles/style.json" />
        <p class="hint">Deixe <code>/tiles/style.json</code> para usar o mapa embutido (arquivo acima) — só troque se for usar um servidor de tiles externo (ex: TileServer GL).</p>

        <label for="cfg-tile-type">Tipo do mapa</label>
        <select id="cfg-tile-type">
          <option value="vector">Vetorial (style.json)</option>
          <option value="raster">Raster (template XYZ de imagem)</option>
        </select>

        <p id="settings-error" class="error" hidden></p>

        <div class="settings-actions">
          <button id="settings-cancel" type="button">Cancelar</button>
          <button id="settings-save" type="button" class="primary">Salvar</button>
        </div>
      </div>
    </div>

    <aside id="layers-panel">
      <h2>Camadas</h2>
      <ul id="layers-list">
        <li class="empty">Carregando...</li>
      </ul>
    </aside>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="static/js/app.js"></script>
</body>
</html>
